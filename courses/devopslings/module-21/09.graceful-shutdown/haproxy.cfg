# The load balancer in front of the orders replicas. Not part of the exercise.
#
# retries 0: a request that fails is returned to the client as a failure. Most
# hops between users and a service do not retry, and the ones that do can only
# safely retry a request that never reached the backend.
global
  log stdout format raw local0

defaults
  mode http
  # Failed requests and server state changes only: docker compose logs lb
  log global
  option httplog
  option dontlog-normal
  timeout connect 1s
  timeout client 30s
  timeout server 30s
  retries 0

frontend web
  bind :8080
  default_backend orders

# Docker's DNS, so a recreated replica is found at its new address.
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s

backend orders
  option httpchk GET /ready
  # One failed /ready (polled every 500ms) takes a replica out of rotation;
  # two passes put it back.
  default-server check inter 500ms fall 1 rise 2 init-addr libc,none resolvers docker
  server a orders-a:8080
  server b orders-b:8080

listen stats
  bind :8404
  stats enable
  stats uri /stats

# Lesson-local service, layered over sandboxes/chaos-stack/compose.yaml.
# Relative paths resolve against the sandbox directory, not this file's.
services:
  shop:
    build: ./app
    command: ["python3", "/lesson/shop.py"]
    volumes:
      - ../../courses/devopslings/module-21/06.pool-exhaustion:/lesson:ro
    environment:
      PRICING_URL: "http://toxiproxy:21080"
      SHOP_THREADS: "${SHOP_THREADS:-16}"
      PRICING_TIMEOUT: "${PRICING_TIMEOUT:-0}"
      PRICING_POOL: "${PRICING_POOL:-0}"
    ports:
      - "18091:8080"
    depends_on:
      toxiproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 2s
      timeout: 3s
      retries: 15

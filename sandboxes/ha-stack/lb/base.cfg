# Loaded before the student's /ha/haproxy.cfg. It holds the parts graders and
# students both read — the stats page and socket — so that rewriting the
# load-balancing config cannot take away the means of checking it.
global
    master-worker
    nbthread 2
    stats socket /run/haproxy.sock mode 600 level admin expose-fd listeners
    log stdout format raw local0

defaults
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s

# Short intervals so a check waits seconds, not minutes. Production is
# usually 15s-60s scrape and evaluation.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /obs/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: shop
    static_configs:
      - targets: ["shop:9101"]

  - job_name: db
    static_configs:
      - targets: ["db:9101"]

  - job_name: orders
    static_configs:
      - targets: ["orders:9101"]

  - job_name: worker
    static_configs:
      - targets: ["worker-a:9101", "worker-b:9101"]

  - job_name: backup
    static_configs:
      - targets: ["backup:9101"]

  - job_name: loadgen
    static_configs:
      - targets: ["loadgen:9101"]

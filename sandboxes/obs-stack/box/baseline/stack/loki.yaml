# Loki, single process, filesystem storage, with the ruler on. Read-only
# infrastructure: lessons change what is sent to Loki and the rules under
# /obs/loki-rules, not Loki itself.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Labels are exactly what the sender chose; Loki adds no service_name of its own.
  discover_service_name: []
  discover_log_levels: false
  allow_structured_metadata: true
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  per_stream_rate_limit: 16MB
  per_stream_rate_limit_burst: 32MB
  # A bad label choice should show up as a slow query and a long series list,
  # not as refused pushes that hang the sender.
  max_global_streams_per_user: 0
  # High enough that a check can count a label's values exactly.
  max_query_series: 20000
  reject_old_samples: false

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: false
  cache_results: false

analytics:
  reporting_enabled: false

# Rules live in the shared volume so a lesson can write them: every *.yaml
# under /obs/loki-rules/fake/ (the tenant when auth is off). Short intervals so
# a rule change and its alert land in seconds.
ruler:
  storage:
    type: local
    local:
      directory: /obs/loki-rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  evaluation_interval: 5s
  poll_interval: 5s
  ring:
    kvstore:
      store: inmemory

# Tempo, single process, local storage. Read-only infrastructure.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Short so a finished trace is searchable within seconds.
  trace_idle_period: 2s
  max_block_duration: 1m

compactor:
  compaction:
    # Blocks live on a tmpfs inside the memory limit; drop them before they fill it.
    block_retention: 6h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
